name: Daily Novel Scrape & Deploy

on:
  schedule:
    # 每天北京时间 02:00 运行 (UTC 18:00)
    - cron: '0 18 * * *'
    # 冗余兜底 05:00 (UTC 21:00)：GitHub schedule 不保证执行且常延迟 3-5h，双触发点提高命中概率；
    # 凌晨时段抓取 = 前一日 24h 热度沉淀后的稳定快照（晋江积分月榜/番茄最热/长佩畅销均为滚动榜，无 0 点日切风险）；
    # 延迟缓冲：02:00 触发即使拖到 05-06 点，08 点前必到位；若 02:00 已跑完，05:00 重抓 diff 为空则不会重复 commit；若仍在跑则被 concurrency 取消重来
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: novel-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 番茄小说 (原生 HTTP，无需 Playwright；看板只展示女频，爬虫内置 gender=0 女频最热榜)
      - name: Scrape Fanqie (番茄小说·女频最热榜)
        run: node scrapers/fanqie.js
        continue-on-error: true

      # 番茄女频 · 今日流行总结（AI，LLM=小米 MiMo Token Plan；前端横幅与长佩同款）
      - name: Fanqie Trend Summary (今日流行总结)
        run: node scrapers/platform-summary.js fanqie
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 晋江文学城 (原生 HTTP)
      - name: Scrape JJWXC (晋江文学城)
        run: node scrapers/jjwxc.js
        continue-on-error: true

      # 晋江月榜 · 今日流行总结（AI，LLM=小米 MiMo Token Plan；前端横幅与长佩同款）
      - name: JJWXC Trend Summary (今日流行总结)
        run: node scrapers/platform-summary.js jjwxc
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 长佩文学 (Playwright)
      - name: Scrape Changpei (长佩文学)
        run: node scrapers/changpei.js
        continue-on-error: true
        timeout-minutes: 45

      # 长佩总榜 · 今日流行总结（AI，LLM=小米 MiMo Token Plan；2026-09-09d 起与晋江/七猫/番茄统一走 platform-summary.js，替代原 changpei-summary.js 纯规则词典）
      - name: Changpei Trend Summary (今日流行总结)
        run: node scrapers/platform-summary.js changpei
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 七猫小说 (公开API，无需浏览器；看板只展示女频，抓女频 8 榜 → 去重池 pool.json)
      - name: Scrape Qimao (七猫小说·女频 8 榜去重池)
        run: node scrapers/qimao.js --girl
        continue-on-error: true

      # 七猫女频 · 今日流行总结（AI，LLM=小米 MiMo Token Plan；前端横幅与长佩同款）
      - name: Qimao Trend Summary (今日流行总结)
        run: node scrapers/platform-summary.js qimao
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 晋江积分榜 Top1000 (每月1号更新 或 手动触发时运行，10页1000本)
      - name: Scrape JJWXC Score1000 (晋江积分榜Top1000)
        run: |
          DOM=$(date -u +%d)
          if [ "$DOM" = "01" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running jjwxc score1000 scraper (day=$DOM, event=${{ github.event_name }})"
            node scrapers/jjwxc-score.js
          else
            echo "Skipping jjwxc score1000 scraper (only runs on 1st of month or manual trigger)"
          fi
        continue-on-error: true
        timeout-minutes: 15

      # 番茄巅峰榜 Top30 (每月2号更新 或 手动触发时运行；番茄官网巅峰榜每月1号刷新，2号抓保险)
      - name: Scrape Fanqie Peak (番茄巅峰榜Top30)
        run: |
          DOM=$(date -u +%d)
          if [ "$DOM" = "02" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running fanqie peak scraper (day=$DOM, event=${{ github.event_name }})"
            node scrapers/fanqie-rank.js
          else
            echo "Skipping fanqie peak scraper (only runs on 2nd of month or manual trigger)"
          fi
        continue-on-error: true
        timeout-minutes: 10

# AI 智能分析
      - name: AI Analysis (概览深度分析)
        run: node scrapers/analyze.js
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro
        continue-on-error: true

      # 生成独立 HTML 摘要(自包含,推送到 main 后用 jsDelivr CDN 访问)
      - name: Build digest HTML (生成独立 HTML 摘要)
        run: node scrapers/build-digest.js
        continue-on-error: true

      - name: Commit & Push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "📊 update: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Handle potential conflicts from concurrent pushes
          for i in 1 2 3; do
            git push && break
            echo "Push failed, attempt $i. Pulling and retrying..."
            git pull --rebase origin main --strategy-option=theirs || true
            sleep 2
          done

      # 飞书通知：抓取 + 提交结束后推送到飞书机器人。
      # Webhook URL 来自 repo Secrets.FEISHU_WEBHOOK，禁止写明文进代码。
      # if: always() 保障 scrape job 任意结束状态都推一次（含某些 step 失败的诊断信息）。
      # 推送内容含 jsDelivr CDN 链接 → 飞书点开是 data/digest.html（独立 HTML）
      - name: Notify Feishu (飞书推送)
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_EVENT: ${{ github.event_name }}
          GH_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "FEISHU_WEBHOOK secret 未配置，跳过飞书推送"
            exit 0
          fi

          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          OWNER=$(echo "$GH_REPOSITORY" | cut -d/ -f1)
          REPO=$(echo "$GH_REPOSITORY" | cut -d/ -f2)
          # digest.html 在 main 分支的 raw URL,经 htmlpreview.github.io 转一层
          # (jsDelivr 对 .html 强制 text/plain + nosniff,浏览器看到是源码;htmlpreview 用 JS
          # 拉取后用 iframe 渲染,等价于在浏览器里打开 HTML)
          DIGEST_URL="https://htmlpreview.github.io/?https://raw.githubusercontent.com/${OWNER}/${REPO}/main/data/digest.html"
          RUN_URL="https://github.com/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}"

          # 用 latest.json + summary.json 双文件存在判定平台是否抓到当日数据
          check() {
            if [ -s "data/$1/latest.json" ] && [ -s "data/$1/summary.json" ]; then
              CNT=$(node -e "const j=require('./data/$1/latest.json');console.log(Array.isArray(j)?j.length:(j.books?j.books.length:'?'))" 2>/dev/null || echo "?")
              echo "✅ ${CNT} 本"
            else
              echo "❌ 缺数据"
            fi
          }
          FQ=$(check fanqie)
          JW=$(check jjwxc)
          CP=$(check changpei)
          QM=$(check qimao)
          LATEST_COMMIT=$(git log -1 --pretty='%h %s' 2>/dev/null || echo "(无提交)")
          DIGEST_SIZE=$(stat -c '%s' data/digest.html 2>/dev/null || echo 0)
          DIGEST_NOTE="digest.html (${DIGEST_SIZE} bytes)"

          # 状态色：success=blue / failure=red / 其他=orange
          if [ "$JOB_STATUS" = "success" ]; then COLOR=blue
          elif [ "$JOB_STATUS" = "failure" ]; then COLOR=red
          else COLOR=orange; fi

          cat > /tmp/feishu.json <<JSON
          {
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": {"tag": "plain_text", "content": "📚 novel-tracker 每日抓取"},
                "template": "${COLOR}"
              },
              "elements": [
                {"tag": "div", "fields": [
                  {"is_short": true, "text": {"tag": "lark_md", "content": "**日期**\n${DATE}"}},
                  {"is_short": true, "text": {"tag": "lark_md", "content": "**触发**\n${GH_EVENT}"}},
                  {"is_short": true, "text": {"tag": "lark_md", "content": "**Job 状态**\n${JOB_STATUS}"}}
                ]},
                {"tag": "hr"},
                {"tag": "div", "text": {"tag": "lark_md", "content": "**抓取结果**\n• 🍅 番茄: ${FQ}\n• 📚 晋江: ${JW}\n• 🎭 长佩: ${CP}\n• 🐱 七猫: ${QM}"}},
                {"tag": "div", "text": {"tag": "lark_md", "content": "**最近提交**\n${LATEST_COMMIT}"}},
                {"tag": "hr"},
                {"tag": "action", "actions": [
                  {"tag": "button", "text": {"tag": "plain_text", "content": "📊 打开摘要 HTML"}, "type": "primary", "url": "${DIGEST_URL}"},
                  {"tag": "button", "text": {"tag": "plain_text", "content": "🔧 查看 Run"}, "type": "default", "url": "${RUN_URL}"}
                ]},
                {"tag": "note", "elements": [{"tag": "plain_text", "content": "${DIGEST_NOTE} · htmlpreview.github.io 渲染 · webhook 来自 Secrets.FEISHU_WEBHOOK"}]}
              ]
            }
          }
          JSON

          HTTP_CODE=$(curl -s -o /tmp/feishu_resp.json -w "%{http_code}" \
            -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/feishu.json)
          echo "Feishu HTTP: $HTTP_CODE"
          cat /tmp/feishu_resp.json 2>/dev/null || true
          echo ""

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest data
        run: git pull origin main

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
