name: Rerun AI Analysis

# 只重跑 AI 分析层（analyze.js 概览四维分析 + platform-summary.js 各平台今日流行总结），
# 不跑爬虫，约 5-10 分钟。用于上游 LLM 接口瞬态故障导致某平台分析为空时快速补数，
# 无需等主流程（daily-scrape.yml）的 45 分钟全量抓取。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: novel-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: AI Analysis (概览深度分析)
        run: node scrapers/analyze.js
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro

      - name: Platform Trend Summaries
        run: |
          for p in fanqie jjwxc changpei qimao; do
            echo "=== $p ==="
            node scrapers/platform-summary.js "$p" || true
          done
        env:
          LLM_API_KEY: ${{ secrets.MIMO_API_KEY }}
          LLM_BASE_URL: https://token-plan-cn.xiaomimimo.com/v1
          LLM_MODEL: mimo-v2.5-pro

      - name: Commit & Push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "AI analysis rerun: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && break
            echo "Push failed, attempt $i. Pulling and retrying..."
            git pull --rebase origin main --strategy-option=theirs || true
            sleep 2
          done

      # 飞书通知：AI 复跑结束后推送摘要。
      - name: Notify Feishu (AI 复跑结果)
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "FEISHU_WEBHOOK secret 未配置，跳过飞书推送"
            exit 0
          fi

          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          OWNER=$(echo "$GH_REPOSITORY" | cut -d/ -f1)
          REPO=$(echo "$GH_REPOSITORY" | cut -d/ -f2)
          PAGE_URL="https://${OWNER}.github.io/${REPO}/"
          RUN_URL="https://github.com/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}"

          if [ -s "data/analysis.json" ]; then
            HEADLINE=$(node -e "try{const j=require('./data/analysis.json');console.log((j.overall_summary||'').slice(0,180))}catch(e){console.log('(解析失败)')}" 2>/dev/null)
            ANALYSIS="✅ 已更新"
          else
            HEADLINE="(本日 analysis.json 缺失)"
            ANALYSIS="❌ 缺数据"
          fi
          LATEST_COMMIT=$(git log -1 --pretty='%h %s' 2>/dev/null || echo "(无提交)")

          if [ "$JOB_STATUS" = "success" ]; then COLOR=blue
          elif [ "$JOB_STATUS" = "failure" ]; then COLOR=red
          else COLOR=orange; fi

          cat > /tmp/feishu.json <<JSON
          {
            "msg_type": "interactive",
            "card": {
              "header": {
                "title": {"tag": "plain_text", "content": "🧠 novel-tracker AI 分析复跑"},
                "template": "${COLOR}"
              },
              "elements": [
                {"tag": "div", "fields": [
                  {"is_short": true, "text": {"tag": "lark_md", "content": "**日期**\n${DATE}"}},
                  {"is_short": true, "text": {"tag": "lark_md", "content": "**Job 状态**\n${JOB_STATUS}"}},
                  {"is_short": true, "text": {"tag": "lark_md", "content": "**analysis.json**\n${ANALYSIS}"}}
                ]},
                {"tag": "hr"},
                {"tag": "div", "text": {"tag": "lark_md", "content": "**概览摘要**\n${HEADLINE}"}},
                {"tag": "div", "text": {"tag": "lark_md", "content": "**最近提交**\n${LATEST_COMMIT}"}},
                {"tag": "action", "actions": [
                  {"tag": "button", "text": {"tag": "plain_text", "content": "📊 查看 Pages"}, "type": "primary", "url": "${PAGE_URL}"},
                  {"tag": "button", "text": {"tag": "plain_text", "content": "🔧 查看 Run"}, "type": "default", "url": "${RUN_URL}"}
                ]},
                {"tag": "note", "elements": [{"tag": "plain_text", "content": "由 GitHub Actions 自动推送 · webhook 来自 Secrets.FEISHU_WEBHOOK"}]}
              ]
            }
          }
          JSON

          HTTP_CODE=$(curl -s -o /tmp/feishu_resp.json -w "%{http_code}" \
            -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/feishu.json)
          echo "Feishu HTTP: $HTTP_CODE"
          cat /tmp/feishu_resp.json 2>/dev/null || true
          echo ""

  deploy:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest data
        run: git pull origin main

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
